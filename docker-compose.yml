services:

  mysql:
    image: mysql:8.4
    container_name: hotel_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotel_pass

    ports:
      - "3306:3306"

    volumes:
      - hotel_mysql_data:/var/lib/mysql

volumes:
  hotel_mysql_data: